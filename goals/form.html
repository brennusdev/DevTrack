{% extends "base.html" %}


{% block title %}
    DevTrack | Nova meta
{% endblock %}


{% block content %}

<div class="page-container">

    <header class="page-header">

        <div>

            <span class="eyebrow">
                OBJETIVOS
            </span>

            <h1>
                Nova meta
            </h1>

        </div>

    </header>


    <section class="form-card">

        <form
            method="POST"
            class="devtrack-form"
        >

            <div class="form-group">

                <label for="title">
                    Título da meta
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Ex.: Aprender SQL"
                    required
                >

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('goals.list_goals') }}"
                    class="secondary-button"
                >
                    Cancelar
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Criar meta
                </button>

            </div>

        </form>

    </section>

</div>

{% endblock %}
