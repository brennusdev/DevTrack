<!DOCTYPE html>

<!--
    Define que este documento utiliza HTML5.
-->

<html lang="pt-BR">

<head>

    <!--
        Define a codificação dos caracteres.

        UTF-8 permite utilizar caracteres como:
        á, ç, ã, ê etc.
    -->
    <meta charset="UTF-8">

    <!--
        Faz com que a página seja adaptável
        a diferentes tamanhos de tela.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        O bloco "title" poderá ser substituído
        pelas páginas que herdarem este template.
    -->
    <title>
        {% block title %}
            DevTrack
        {% endblock %}
    </title>

    <!--
        Importamos nosso arquivo CSS.

        url_for() é uma função do Flask utilizada
        para gerar corretamente a URL de recursos
        estáticos.
    -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!--
        Área principal da aplicação.
    -->
    <main class="container">
        <main class="container">

    <!--
        =================================================
        FLASH MESSAGES
        =================================================

        O Flask utiliza flash() para enviar mensagens
        temporárias para a interface.

        Exemplos:

        - operação realizada com sucesso;
        - erro de validação;
        - aviso para o usuário.
    -->

    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            <div class="flash-container">

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    {% block content %}
    {% endblock %}

</main>

        <!--
            Cada página poderá inserir seu conteúdo
            dentro deste bloco.
        -->
        {% block content %}
        {% endblock %}

    </main>

</body>
<footer> Feito por Brenno Pereira <footer>
</html>
