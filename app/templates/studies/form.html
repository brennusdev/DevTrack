{% extends "base.html" %}


{% block title %}
    DevTrack | Novo estudo
{% endblock %}


{% block content %}

<div class="page-container">

    <header class="page-header">

        <div>

            <span class="eyebrow">
                APRENDIZADO
            </span>

            <h1>
                Registrar estudo
            </h1>

        </div>

    </header>


    <section class="form-card">

        <form
            method="POST"
            class="devtrack-form"
        >

            <div class="form-group">

                <label for="technology">
                    Tecnologia
                </label>

                <input
                    type="text"
                    id="technology"
                    name="technology"
                    placeholder="Ex.: Python"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    O que você estudou?
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Ex.: Classes e objetos"
                    required
                >

            </div>


            <div class="form-group">

                <label for="hours">
                    Horas estudadas
                </label>

                <input
                    type="number"
                    id="hours"
                    name="hours"
                    min="0.1"
                    step="0.1"
                    placeholder="Ex.: 2.5"
                    required
                >

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('studies.list_studies') }}"
                    class="secondary-button"
                >
                    Cancelar
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Registrar estudo
                </button>

            </div>

        </form>

    </section>

</div>

{% endblock %}
